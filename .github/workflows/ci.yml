name: CI

# Экономия минут Actions: CI — только на PR и на main (не на каждый пуш ветки — иначе ветка с PR гоняется дважды);
# правки одних документов CI не запускают. Автоматически — только быстрые проверки; e2e на CI — только вручную
# (Run workflow): полный e2e гоняется локально перед PR, результат — в описании PR.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Только для CI: секреты-заглушки, БД — сервис-контейнер. e2e сами создают и засевают базу herofit_test.
env:
  DATABASE_URL: postgresql://herofit:herofit@localhost:5432/herofit
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
  APP_URL: http://localhost:3123
  CRON_SECRET: ci-cron-secret-0123456789abcdef
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # postinstall: prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Build + e2e (desktop)
    # Только вручную (Run workflow): лимит бесплатных минут Actions, e2e гоняется локально перед PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ~560 сценариев на 2 ядрах приватного раннера не укладываются в 30 мин — задача отменялась по лимиту
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: herofit
          POSTGRES_PASSWORD: herofit
          POSTGRES_DB: herofit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herofit -d herofit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: VAPID keys for push tests
        run: |
          keys=$(npx web-push generate-vapid-keys --json)
          echo "VAPID_PUBLIC_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0)).publicKey')" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0)).privateKey')" >> "$GITHUB_ENV"
      # Кэш сборки Next: повторная сборка — только изменённое
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # Браузер Playwright — из кэша по версии в lock-файле; системные библиотеки ставятся всегда (их в кэше нет)
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Только desktop: полный прогон desktop + mobile на 2 ядрах — 40–50 мин минут Actions на пуш.
      # Mobile — в локальном прогоне перед PR (npm run test:e2e -- --workers=8)
      - run: npm run test:e2e -- --project=desktop
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

services:
  db:
    image: postgres:17-alpine
    container_name: hero-fit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: herofit
      POSTGRES_PASSWORD: herofit
      POSTGRES_DB: herofit
    ports:
      - "5432:5432"
    volumes:
      - hero-fit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herofit -d herofit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hero-fit-pgdata:

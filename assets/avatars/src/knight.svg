    <!-- забрало -->
    <rect x="86" y="108" width="84" height="12" rx="6" fill="#0f172a"/>
    <rect x="86" y="108" width="84" height="4" rx="2" fill="#020617"/>
    <path d="M86 128 h84" stroke="#334155" stroke-width="3"/>

# Прод на сервере: Postgres + миграции + приложение + Caddy (HTTPS) + ежедневный бэкап.
# Лежит в /opt/hero-fit рядом с Caddyfile и .env (пример — deploy/.env.example).
# Образы собирает задача deploy в .gitlab-ci.yml и пушит в registry ниже, тег — IMAGE_TAG (sha коммита).
name: hero-fit

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-herofit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-herofit}
    # Только localhost сервера: снаружи не виден, подключение с ПК — через SSH-туннель (deploy/README.md).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${IMAGE_REPO:-localhost:5000/hero-fit}-migrate:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${IMAGE_REPO:-localhost:5000/hero-fit}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # ntfy — push в Android-приложении (UnifiedPush, спека 2026-10-25-native-push-ntfy). Тело push зашифровано ключами
  # устройства, сервер его не видит. Снаружи — через Caddy на push.<домен>; конфиг — переменными NTFY_* (на сервер
  # копируются только этот файл и Caddyfile). Доступ к топикам up* открывается один раз командой из deploy/README.md.
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: https://push.${DOMAIN}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_VISITOR_SUBSCRIBER_RATE_LIMITING: "true"
    volumes:
      - ntfy_data:/var/lib/ntfy

  # Реестр образов только для деплоя: слушает localhost сервера, CI пушит в него через SSH-туннель.
  # Хранится только latest, прошлые слои чистит garbage-collect после деплоя.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry:/var/lib/registry

  # pg_dump раз в сутки в ./backups, хранится 14 дней.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-herofit}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-herofit}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -Fc > /backups/herofit-$$(date +%Y%m%d-%H%M).dump && echo "backup ok"
          find /backups -name 'herofit-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  registry:
  ntfy_data:

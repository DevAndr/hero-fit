# Аналог .github/workflows/ci.yml. Автоматически — только быстрые проверки (на MR и на main, без дублей
# от пуша ветки с MR); правки одних документов CI не запускают. e2e — только вручную (кнопка ▶ у задачи):
# полный e2e гоняется локально перед MR, результат — в описании MR.
workflow:
  rules:
    # Run pipeline из интерфейса — всегда (аналог workflow_dispatch)
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &code
        # GitLab не умеет исключать пути (paths-ignore) — перечислены каталоги и файлы кода вместо docs/ и *.md
        - app/**/*
        - assets/**/*
        - components/**/*
        - deploy/**/*
        - e2e/**/*
        - lib/**/*
        - prisma/**/*
        - public/**/*
        - scripts/**/*
        - "*.{ts,mts,mjs,json}"
        - Dockerfile
        - docker-compose.yml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *code
  # Новый коммит в ветку отменяет её незавершённый пайплайн (аналог concurrency.cancel-in-progress)
  auto_cancel:
    on_new_commit: interruptible

# Только для CI: секреты-заглушки, БД — сервис-контейнер. e2e сами создают и засевают базу herofit_test.
variables:
  DATABASE_URL: postgresql://herofit:herofit@postgres:5432/herofit
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
  APP_URL: http://localhost:3123
  CRON_SECRET: ci-cron-secret-0123456789abcdef
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: $CI_PROJECT_DIR/.npm

stages: [test, deploy]

default:
  image: node:24-bookworm
  interruptible: true

.npm-cache: &npm-cache
  key:
    files: [package-lock.json]
    prefix: npm
  paths: [.npm/]

checks:
  stage: test
  timeout: 15m
  cache:
    - *npm-cache
  script:
    - npm ci --prefer-offline # postinstall: prisma generate
    - npm run typecheck
    - npm run lint
    - npm test

e2e:
  stage: test
  # Только вручную; allow_failure — не держит пайплайн в статусе «заблокирован», пока e2e не запущен
  rules:
    - when: manual
      allow_failure: true
  # ~560 сценариев на 2 воркерах не укладываются в 30 мин
  timeout: 60m
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: herofit
    POSTGRES_PASSWORD: herofit
    POSTGRES_DB: herofit
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  cache:
    - *npm-cache
    # Кэш сборки Next: повторная сборка — только изменённое
    - key: next-$CI_COMMIT_REF_SLUG
      fallback_keys: [next-$CI_DEFAULT_BRANCH]
      paths: [.next/cache/]
    # Браузер Playwright — из кэша по версии в lock-файле; системные библиотеки ставятся всегда (их в кэше нет)
    - key:
        files: [package-lock.json]
        prefix: playwright
      paths: [.cache/ms-playwright/]
  script:
    - npm ci --prefer-offline
    # VAPID-ключи для push-тестов
    - |
      keys=$(npx web-push generate-vapid-keys --json)
      export VAPID_PUBLIC_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0)).publicKey')
      export VAPID_PRIVATE_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0)).privateKey')
    - npm run build
    - npx playwright install --with-deps chromium
    # Только desktop; mobile — в локальном прогоне перед MR (npm run test:e2e -- --workers=8)
    - npm run test:e2e -- --project=desktop
  artifacts:
    name: playwright-test-results
    when: on_failure
    paths: [test-results/]
    expire_in: 7 days

# Аналог .github/workflows/deploy.yml: прод обновляется после зелёного checks на main (push или Run pipeline).
# Образы — GHCR, сервер — docker compose в DEPLOY_PATH. Переменные проекта (Settings → CI/CD → Variables):
#   PROD_APP_URL  https://домен — вшивается в сборку; пока не задана, деплой пропускается
#   GHCR_USER, GHCR_TOKEN  GitHub classic-токен со scope write:packages (сервер скачивает образы им же)
#   SSH_HOST, SSH_USER, SSH_KEY (тип File, приватный ключ), SSH_PORT (необязательно)
#   YM_ID (номер счётчика Яндекс.Метрики, необязательно), DEPLOY_PATH (по умолчанию /opt/hero-fit)
deploy:
  stage: deploy
  needs: [checks]
  rules:
    - if: $PROD_APP_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  # Выкатки по очереди, начатая не отменяется (аналог concurrency: deploy, cancel-in-progress: false)
  resource_group: production
  interruptible: false
  environment:
    name: production
    url: $PROD_APP_URL
  timeout: 45m
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    # Значения по умолчанию; переменные проекта с теми же именами их перекрывают
    GHCR_IMAGE: ghcr.io/devandr/hero-fit
    DEPLOY_PATH: /opt/hero-fit
    SSH_PORT: "22"
    YM_ID: ""
  script:
    - apk add --no-cache openssh-client
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    # Кэш слоёв — в GHCR (тег buildcache) вместо кэша GitHub Actions
    - docker buildx create --use --driver docker-container
    - >
      docker buildx build . --target runner --push
      --build-arg APP_URL="$PROD_APP_URL" --build-arg NEXT_PUBLIC_YM_ID="$YM_ID"
      -t "$GHCR_IMAGE:$CI_COMMIT_SHA" -t "$GHCR_IMAGE:latest"
      --cache-from type=registry,ref="$GHCR_IMAGE:buildcache"
      --cache-to type=registry,ref="$GHCR_IMAGE:buildcache",mode=max
    - >
      docker buildx build . --target migrate --push
      --build-arg APP_URL="$PROD_APP_URL"
      -t "$GHCR_IMAGE-migrate:$CI_COMMIT_SHA" -t "$GHCR_IMAGE-migrate:latest"
      --cache-from type=registry,ref="$GHCR_IMAGE:buildcache"
    - chmod 600 "$SSH_KEY"
    - SSH_OPTS="-i $SSH_KEY -o Port=$SSH_PORT -o StrictHostKeyChecking=accept-new"
    - scp $SSH_OPTS deploy/docker-compose.yml deploy/Caddyfile "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
    # Токен — через stdin, не в командной строке сервера
    - echo "$GHCR_TOKEN" | ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
    - |
      ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "SHA='$CI_COMMIT_SHA' IMAGE='$GHCR_IMAGE' DEPLOY_PATH='$DEPLOY_PATH' sh -s" <<'EOF'
      set -eu
      cd "$DEPLOY_PATH"
      trap 'docker logout ghcr.io >/dev/null' EXIT
      export IMAGE_REPO="$IMAGE" IMAGE_TAG="$SHA"
      docker compose pull migrate app
      docker compose up -d --remove-orphans
      # Caddyfile смонтирован файлом — up -d его не перечитывает
      docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
      health() { docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)"; }
      i=0
      until [ "$(health)" = healthy ]; do
        i=$((i + 1))
        if [ "$i" -ge 30 ]; then
          docker compose ps
          docker compose logs --tail 50 app
          echo "app is not healthy after 150s" >&2
          exit 1
        fi
        sleep 5
      done
      docker compose ps
      # Каждый деплой — новые образы с тегом sha; неиспользуемые старше 3 суток удаляем (недавние — для отката)
      docker image prune -a -f --filter "until=72h"
      EOF
